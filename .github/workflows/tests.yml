name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "01-ingest-api-shopify-stripe/requirements-ci.txt"

      - name: Install dependencies
        working-directory: 01-ingest-api-shopify-stripe
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Debug imports
        working-directory: 01-ingest-api-shopify-stripe
        env:
          API_KEY: "test-api-key-for-ci-1234567890"
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
        run: |
          python -c "import app.main; print('import app.main OK')"
          python -c "import app.config; print('import config OK')"
          python -c "import app.database; print('import database OK')"
          python -m pytest --collect-only -v

      - name: Run tests
        working-directory: 01-ingest-api-shopify-stripe
        env:
          API_KEY: "test-api-key-for-ci-1234567890"
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
        run: pytest -v --tb=short