name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: 01-ingest-api-shopify-stripe
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: 01-ingest-api-shopify-stripe
        env:
          API_KEY: "test-api-key-for-ci-1234567890"
          DATABASE_URL: "postgresql+asyncpg://de_user:de_pass@localhost:5433/de_db"
        run: pytest -v
