<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dashboard Ventes - Client</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
    .cards { display: flex; gap: 15px; }
    .card { background: white; padding: 20px; border-radius: 10px; flex: 1; box-shadow: 0 2px 5px #ddd; }
    .card h2 { margin: 0; font-size: 14px; color: #666; }
    .card p { font-size: 28px; margin: 10px 0 0; font-weight: bold; }
    table { width: 100%; background: white; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
  </style>
</head>
<body>
  <h1>Dashboard Ventes</h1>
  <div class="cards">
    <div class="card"><h2>Total Commandes</h2><p id="total">...</p></div>
    <div class="card"><h2>Revenu Total</h2><p id="revenue">...</p></div>
    <div class="card"><h2>Shopify</h2><p id="shopify">...</p></div>
    <div class="card"><h2>Stripe</h2><p id="stripe">...</p></div>
  </div>

  <h2>Dernieres ventes</h2>
  <table>
    <thead><tr><th>Source</th><th>Montant</th><th>Date</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

<script>
const API = "http://localhost:8001";


function cleanSource(raw) {
  const s = String(raw || "").toLowerCase();
  if (s.includes("shopify")) return "shopify";
  if (s.includes("stripe")) return "stripe";
  return s;
}

async function load() {
  try {
    const statsRes = await fetch(API + "/stats");
    const stats = await statsRes.json();
    console.log("STATS RECUES :", stats);

    let totalOrders = 0, totalRev = 0;
    stats.forEach(s => {
      const source = cleanSource(s.source);
      totalOrders += s.total || 0;
      totalRev += s.total_amount || 0;
      if (source === 'shopify') document.getElementById('shopify').textContent = s.total + " / " + s.total_amount.toLocaleString() + " €";
      if (source === 'stripe') document.getElementById('stripe').textContent = s.total + " / " + s.total_amount.toLocaleString() + " €";
    });
    document.getElementById('total').textContent = totalOrders;
    document.getElementById('revenue').textContent = totalRev.toLocaleString() + " €";

    const dataRes = await fetch(API + "/data?limit=10");
    const data = await dataRes.json();
    console.log("DATA RECUE :", data);
    const rows = data.map(d => {
      const src = cleanSource(d.source);
      const montant = d.amount ?? d.total_amount ?? 0;
      const date = d.created_at || d.date || '';
      return `<tr><td>${src}</td><td>${montant} €</td><td>${date}</td></tr>`;
    }).join('');
    document.getElementById('rows').innerHTML = rows;
  } catch(e) {
    console.error(e);
  }
}
load();
</script>
</body>
</html>
